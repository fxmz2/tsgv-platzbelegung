<style>
:root{
  --bg:#06101F;--surface:#0B1A33;--surface2:#112445;--line:#1A2F55;--line2:#284378;
  --text:#F2F6FC;--muted:#8FA3C6;--accent:#FFFFFF;--ink:#0A1E45;
  --club:#1C58A4;--club2:#123E7A;--hi:#7FB6FF;
  --bad:#FF5C5C;--warn:#FFB547;--ok:#4ADE80;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font:15px/1.4 'Barlow',system-ui,sans-serif;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}

/* ---------- header & nav ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(120deg,var(--club),var(--club2));border-bottom:1px solid rgba(255,255,255,.14);box-shadow:0 2px 14px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.crest{height:44px;width:auto;flex:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.brand b{font:400 23px/1 'Bebas Neue';letter-spacing:.04em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font:600 11.5px/1 'Barlow Condensed';letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.who{display:flex;align-items:center;gap:8px;flex:none}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid rgba(255,255,255,.35);font:700 13px/34px 'Barlow Condensed';text-align:center;overflow:hidden;flex:none;display:inline-block}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
select.demo{background:#2A2410;border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:6px 8px;font:600 13px 'Barlow Condensed';letter-spacing:.04em;max-width:118px;min-height:0;width:auto}
.nav{display:flex;gap:4px;padding:6px 12px;background:var(--bg);border-bottom:1px solid var(--line);max-width:1240px;margin:0 auto}
.nav button{flex:1;padding:9px 6px;border-radius:10px;font:600 13.5px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:#fff;background:var(--club)}
.nav .nb{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px 'Barlow';letter-spacing:0}
@media (max-width:899px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid var(--line);border-bottom:0;padding-bottom:max(6px,env(safe-area-inset-bottom));background:rgba(6,16,31,.96)}
  .has-nav .main{padding-bottom:150px}
  .has-nav .fab{bottom:calc(80px + env(safe-area-inset-bottom))}
}
@media (min-width:900px){.nav button{flex-direction:row;justify-content:center;gap:8px;flex:0 0 auto;padding:9px 16px}.nav button svg{width:18px;height:18px}.nav .nb{position:static}}

.main{max-width:1240px;margin:0 auto;padding:14px 16px 100px}
.h{font:400 28px/1 'Bebas Neue';letter-spacing:.04em;margin:6px 0 12px}
section+section{margin-top:28px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;font:700 15px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;background:var(--surface2);border:1px solid var(--line2)}
.btn.primary{background:var(--accent);color:var(--ink);border-color:transparent}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.ghost.danger{color:var(--bad);background:transparent;border-color:rgba(255,92,92,.35)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}
.pill{padding:7px 12px;border-radius:999px;border:1px solid var(--line2);font:600 13px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.pill.warn{color:var(--bad);border-color:rgba(255,92,92,.45)}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line2);font-size:20px;line-height:1;flex:none}
.iconbtn.danger{color:var(--bad);border-color:rgba(255,92,92,.35);font-size:15px}
.badge{background:var(--bad);color:#fff;border-radius:999px;padding:2px 9px;font:700 12px 'Barlow'}

/* ---------- plan ---------- */
.weekbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.wk{flex:1;min-width:120px;text-align:center}
.wk b{font:400 26px/1 'Bebas Neue';letter-spacing:.05em;display:block}
.wk span{font:600 13px 'Barlow Condensed';letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}
.strip button{padding:7px 0 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:1px}
.strip small{font:600 11.5px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.strip b{font:400 22px/1 'Bebas Neue'}
.strip .dots{display:flex;gap:2px;height:6px;margin-top:2px}
.strip .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.strip button.today b{color:var(--hi)}
.strip button.on{background:var(--accent);border-color:var(--accent)}
.strip button.on small,.strip button.on b{color:var(--ink)}
.strip button.on .dots i{outline:1px solid var(--ink)}
.dayttl{font:600 15px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;margin:4px 2px 8px;color:var(--muted)}
.boardwrap{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:auto;max-height:calc(100dvh - 330px);min-height:300px;overscroll-behavior:contain}
@media (min-width:900px){.boardwrap{max-height:calc(100dvh - 200px)}}
.board{display:grid;min-width:100%}
.gutter .gh,.colhead{height:var(--hh);position:sticky;top:0;z-index:8;background:var(--surface);border-bottom:1px solid var(--line)}
.hrs{position:relative;height:var(--h)}
.hrs span{position:absolute;right:6px;font:600 12px 'Barlow Condensed';color:var(--muted)}
.col{border-left:1px solid var(--line);min-width:0}
.colhead{display:flex;flex-direction:column;justify-content:flex-end}
.dname{display:flex;align-items:baseline;gap:6px;padding:6px 8px 0;font:600 13px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.dname b{font:400 21px/1 'Bebas Neue';color:var(--text)}
.is-today .dname,.is-today .dname b{color:var(--hi)}
.lanes{display:grid;grid-template-columns:1fr 1fr;font:600 10.5px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0 5px}
.lanes span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:var(--h);background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--px))}
.track::after{content:'';position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed var(--line2);pointer-events:none}
.is-today .track{background-color:rgba(127,182,255,.05)}
.ev{position:absolute;z-index:2;border-radius:8px;padding:4px 6px;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:1px;font-size:12px;line-height:1.15;
  background:color-mix(in srgb,var(--c) 24%,var(--surface));border-left:3px solid var(--c)}
.ev b{font:700 11.5px/1.1 'Barlow Condensed';text-transform:uppercase;letter-spacing:.06em;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev time{font:600 11.5px 'Barlow Condensed';color:var(--muted);letter-spacing:.04em}
.ev.tight{flex-direction:row;align-items:center;gap:6px}.ev.tight time,.ev.tight span{display:none}
.ev.pending{z-index:3;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,var(--surface)) 0 6px,color-mix(in srgb,var(--c) 6%,var(--surface)) 6px 12px);border:1.5px dashed var(--c);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.ev.block{z-index:4;--c:var(--bad);background:repeating-linear-gradient(45deg,rgba(255,92,92,.3) 0 6px,rgba(255,92,92,.1) 6px 12px);border:1px solid rgba(255,92,92,.6);border-radius:6px}
.ev.block span{color:#FFD0D0}
.now{position:absolute;left:0;right:0;height:2px;background:var(--hi);z-index:6;pointer-events:none}
.now::before{content:'';position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--hi)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font:600 13px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.legend i.p{background:transparent;border:1.5px dashed var(--muted)}
.legend i.k{background:repeating-linear-gradient(45deg,rgba(255,92,92,.7) 0 3px,rgba(255,92,92,.2) 3px 6px)}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:25;background:var(--club);color:#fff;border:2px solid #fff;border-radius:999px;padding:13px 22px;font:400 21px/1 'Bebas Neue';letter-spacing:.08em;box-shadow:0 8px 24px rgba(0,0,0,.55),0 0 0 4px rgba(28,88,164,.35)}

/* ---------- cards & lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.card.stack{flex-direction:column;align-items:stretch}
.crow{display:flex;gap:12px;align-items:stretch}
.bar{width:4px;border-radius:4px;background:var(--c);flex:none;align-self:stretch}
.cb{flex:1;min-width:0}
.ct{font-weight:600}.ct b{font:700 14px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;color:var(--c);margin-right:4px}
.cm{color:var(--muted);font-size:13.5px;margin-top:2px}
.cact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.cact .btn{padding:9px 14px;font-size:14px}
.card.rejected{opacity:.55}
.st{flex:none;font:700 11.5px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;display:inline-block}
.st-confirmed{background:rgba(74,222,128,.14);color:var(--ok)}
.st-pending{background:rgba(255,181,71,.14);color:var(--warn)}
.st-rejected{background:rgba(255,92,92,.14);color:var(--bad)}
.empty{text-align:center;padding:40px 16px;border:1px dashed var(--line2);border-radius:var(--r);color:var(--muted)}
.empty b{display:block;font:400 22px 'Bebas Neue';letter-spacing:.05em;color:var(--text);margin-bottom:4px}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ucard.new{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.uhead{display:flex;align-items:center;gap:10px;min-width:0}
.un{min-width:0}.un b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.un small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urow{display:flex;gap:8px}
.urow select{flex:1}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{padding:7px 12px;border-radius:999px;border:1px solid var(--line2);font:600 13.5px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tchip.on{background:var(--c);border-color:var(--c);color:var(--ink)}

/* ---------- sheet / dialog / forms ---------- */
.sheet,.dlg{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.dlg{z-index:60;align-items:center;padding:20px}
.sheet-card{width:100%;max-width:560px;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line2);border-radius:20px 20px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease}
@media (min-width:640px){.sheet{align-items:center}.sheet-card{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.dlg-card{width:100%;max-width:420px;background:var(--surface2);border:1px solid var(--line2);border-radius:18px;padding:18px}
.dlg-card h3{font:400 24px 'Bebas Neue';letter-spacing:.04em;margin-bottom:6px}
.dlg-card p{color:var(--muted);margin-bottom:14px;white-space:pre-line}
.dlg-btns{display:flex;flex-direction:column;gap:8px}
.form{display:flex;flex-direction:column;gap:14px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-head h3{font:400 28px/1 'Bebas Neue';letter-spacing:.04em}
.big{font:400 30px/1.05 'Bebas Neue';letter-spacing:.03em}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font:600 12.5px 'Barlow Condensed';letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=text],input:not([type]),input[type=date],input[type=time],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font-size:16px;outline:none;min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--hi)}
textarea{resize:vertical;min-height:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input,.seg input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;padding:9px 14px;border-radius:999px;border:1px solid var(--line2);font:600 14.5px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.chip input:checked+span{background:var(--c,var(--accent));border-color:transparent;color:var(--ink)}
.chip.ghost span{padding:6px 11px;font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:3px;gap:3px}
.seg.seg2{grid-template-columns:1fr 1fr}
.kgrp{display:flex;flex-direction:column;gap:14px}
.ev.game{background:color-mix(in srgb,var(--c) 42%,var(--surface));border-left-width:5px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 70%,transparent)}
.ev.game b{color:#fff}
.ev.game.pending{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,var(--surface)) 0 6px,color-mix(in srgb,var(--c) 12%,var(--surface)) 6px 12px)}
.seg span{display:block;text-align:center;padding:9px 4px;border-radius:9px;font:600 14px 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--muted)}
.seg input:checked+span{background:var(--accent);color:var(--ink)}
.check{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:14px;line-height:1.5;min-height:1px}
.hint .ok,.ok{color:var(--ok)}.hint .warn,.warn{color:var(--warn)}.hint .bad,.bad{color:var(--bad)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.dl dt{font:600 12.5px/1.6 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dt{display:flex;align-items:center;gap:8px;font:700 15px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:80;background:var(--surface2);border:1px solid var(--line2);padding:11px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);transition:transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.show{transform:translate(-50%,0)}
.toast.bad{border-color:var(--bad);color:#FFD0D0}

/* ---------- login / waiting ---------- */

const FIREBASE_VERSION = '10.12.2';

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');

const dowIdx = s => (parse(s).getDay() + 6) % 7;
const mondayOf = s => addDays(s, -dowIdx(s));
const isoWeek = s => { const d = parse(s); d.setDate(d.getDate() + 3 - dowIdx(s)); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7); };
const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
const fromMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const DAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtDate = s => { const d = parse(s); return `${DAYS[dowIdx(s)]} ${d.getDate()}.${d.getMonth() + 1}.`; };
const fmtLong = s => parse(s).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtRange = (a, b) => { const A = parse(a), B = parse(b); return A.getMonth() === B.getMonth() ? `${A.getDate()}.–${B.getDate()}. ${MONTHS[B.getMonth()]}` : `${A.getDate()}. ${MONTHS[A.getMonth()].slice(0,3)} – ${B.getDate()}. ${MONTHS[B.getMonth()].slice(0,3)}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const team = id => CONFIG.teams.find(t => t.id === id) || { id, name: id || '—', color: '#888' };
const AREA = { full: 'Ganzer Platz', A: CONFIG.halves.A, B: CONFIG.halves.B };
const ROLES = { pending: 'Wartet auf Freigabe', viewer: 'Mitglied · nur sehen', trainer: 'Trainer / Betreuer · mit Freigabe', trainer_direct: 'Trainer Aktive · bucht direkt', admin: 'Admin · alles' };
const TRAINER_ROLES = ['trainer', 'trainer_direct'];
const STATUS = { confirmed: 'Bestätigt', pending: 'Ausstehend', rejected: 'Abgelehnt' };
const initials = n => (n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const byTime = (a, b) => (a.date + a.start).localeCompare(b.date + b.start);

// ---------- conflict logic ----------
const halvesClash = (a, b) => a === 'full' || b === 'full' || a === b;
const timeClash = (s1, e1, s2, e2) => s1 < e2 && s2 < e1;
const blockOn = (k, d) => k.dateFrom <= d && d <= k.dateTo;
const blockTimes = k => k.allDay ? [0, 1440] : [toMin(k.start), toMin(k.end)];
function findConflicts(c, bookings, blocks, excludeId) {
  const s = toMin(c.start), e = toMin(c.end), out = [];
  for (const b of bookings) {
    if (b.id === excludeId || b.status !== 'confirmed' || b.date !== c.date) continue;
    if (halvesClash(b.area, c.area) && timeClash(s, e, toMin(b.start), toMin(b.end))) out.push({ kind: 'booking', item: b });
  }
  for (const k of blocks) {
    if (!blockOn(k, c.date)) continue;
    const [bs, be] = blockTimes(k);
    if (halvesClash(k.area, c.area) && timeClash(s, e, bs, be)) out.push({ kind: 'block', item: k });
  }
  return out;
}
const conflictLabel = c => c.kind === 'block'
  ? `Platzsperre – ${c.item.reason}`
  : `${team(c.item.team).name}${c.item.title ? ' · ' + c.item.title : ''} (${c.item.start}–${c.item.end})`;

// ---------- Heimspiele ----------
const YOUTH = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
const SMALL_FIELD = ['E', 'F', 'G'];            // Kleinfeld → nur eine Platzhälfte
const GAME_WINDOW = { adult: [60, 120], youth: [45, 105] };  // Minuten vor / nach Anpfiff
function gameSlot(teamId, age, kickoff, half) {
  const youth = teamId === 'jugend', [pre, post] = youth ? GAME_WINDOW.youth : GAME_WINDOW.adult, k = toMin(kickoff);
  return { start: fromMin(Math.max(0, k - pre)), end: fromMin(Math.min(1440, k + post)), area: youth && SMALL_FIELD.includes(age) ? (half === 'B' ? 'B' : 'A') : 'full' };
}
function readBooking(f) {
  const fd = new FormData(f), g = k => String(fd.get(k) || '').trim();
  const b = { kind: g('kind') || 'training', team: g('team'), date: g('date'), note: g('note') };
  if (b.kind === 'game') {
    b.opponent = g('opponent'); b.kickoff = g('kickoff'); b.ageClass = b.team === 'jugend' ? g('age') : '';
    if (b.kickoff) Object.assign(b, gameSlot(b.team, b.ageClass, b.kickoff, g('garea')));
    b.title = `${b.ageClass ? b.ageClass + '-Jugend · ' : ''}Heimspiel vs. ${b.opponent}`;
    b.repeat = false;
  } else {
    Object.assign(b, { title: g('title'), start: g('start'), end: g('end'), area: g('area') || 'full', repeat: !!fd.get('repeat'), until: g('until') });
  }
  return b;
}
function bookingError(b) {
  if (!b.team) return 'Bitte Mannschaft wählen';
  if (!b.date) return 'Bitte ein Datum angeben';
  if (b.kind === 'game') {
    if (b.team === 'jugend' && !b.ageClass) return 'Bitte die Altersklasse wählen';
    if (!b.opponent) return 'Bitte den Gegner angeben';
    if (!b.kickoff) return 'Bitte die Anstoßzeit angeben';
  } else {
    if (!b.start || !b.end) return 'Bitte Uhrzeit angeben';
    if (toMin(b.end) <= toMin(b.start)) return 'Ende muss nach Beginn liegen';
  }
  return '';
}

// ---------- state ----------
const mq = matchMedia('(min-width: 900px)');
const S = {
  api: null, demo: false, booting: true,
  authUser: null, me: null,
  view: 'plan',
  weekStart: mondayOf(todayYmd()), selDate: todayYmd(),
  bookings: [], blocks: [], pending: [], mine: [], users: [],
  unsub: {}, weekKey: null,
  wide: mq.matches, px: 56, boardScroll: null,
};
mq.addEventListener('change', e => { S.wide = e.matches; S.boardScroll = null; render(); });

const isAdmin = () => S.me?.role === 'admin';
const isMember = () => ['admin', 'viewer', ...TRAINER_ROLES].includes(S.me?.role);
const bookDirect = () => isAdmin() || S.me?.role === 'trainer_direct';
const bookableTeams = () => isAdmin() ? CONFIG.teams.map(t => t.id) : TRAINER_ROLES.includes(S.me?.role) ? (S.me.teams || []).filter(id => CONFIG.teams.some(t => t.id === id)) : [];
const canBook = () => bookableTeams().length > 0;
const lookup = id => S.bookings.find(b => b.id === id) || S.pending.find(b => b.id === id) || S.mine.find(b => b.id === id);

// ---------- subscriptions ----------
function toggleSub(key, on, start, clear) {
  if (on && !S.unsub[key]) S.unsub[key] = start() || (() => {});
  else if (!on && S.unsub[key]) { S.unsub[key](); S.unsub[key] = null; clear(); }
}
function syncSubs() {
  const m = isMember(), a = isAdmin();
  if (m && S.weekKey !== S.weekStart) {
    S.unsub.week?.();
    S.weekKey = S.weekStart;
    S.unsub.week = S.api.subBookings(S.weekStart, addDays(S.weekStart, 6), l => { S.bookings = l; render(); });
  } else if (!m && S.unsub.week) { S.unsub.week(); S.unsub.week = null; S.weekKey = null; S.bookings = []; }
  toggleSub('blocks', m, () => S.api.subBlocks(l => { S.blocks = l; render(); }), () => S.blocks = []);
  toggleSub('mine', m, () => S.api.subMine(S.me.id, l => { S.mine = l; render(); }), () => S.mine = []);
  toggleSub('pending', a, () => S.api.subPending(l => { S.pending = l; render(); }), () => S.pending = []);
  toggleSub('users', a, () => S.api.subUsers(l => { S.users = l; render(); }), () => S.users = []);
}
function stopAll() {
  Object.values(S.unsub).forEach(f => f && f());
  S.unsub = {}; S.weekKey = null;
  S.bookings = []; S.blocks = []; S.pending = []; S.mine = []; S.users = [];
}
async function onAuth(u) {
  stopAll(); closeSheet();
  S.authUser = u; S.me = null; S.boardScroll = null; S.view = 'plan';
  render();
  if (!u) return;
  try { await S.api.ensureProfile(u); } catch (e) { reportErr(e); }
  S.unsub.me = S.api.subUser(u.uid, p => {
    S.me = p || { id: u.uid, name: u.name, email: u.email, photo: u.photo, role: 'pending', teams: [] };
    syncSubs(); render();
  });
}

// ---------- rendering ----------
let raf = 0;
function render() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; doRender(); }); }
function doRender() {
  const app = $('#app');
  const w = app.querySelector('.boardwrap');
  if (w) S.boardScroll = w.scrollTop;
  document.body.classList.toggle('has-nav', false);
  if (S.booting) app.innerHTML = `<div class="gate"><div class="spin"></div></div>`;
  else if (!S.authUser) app.innerHTML = loginHtml();
  else if (!S.me) app.innerHTML = `<div class="gate"><div class="spin"></div></div>`;
  else if (!isMember()) app.innerHTML = waitingHtml();
  else app.innerHTML = shellHtml();
  const nw = app.querySelector('.boardwrap');
  if (nw) nw.scrollTop = S.boardScroll ?? (S.wide ? 0 : Math.max(0, (Math.min(15, CONFIG.dayEnd - 3) - CONFIG.dayStart) * S.px));
}

function loginHtml() {
  return `<div class="gate">
    ${pitchSvg}
    <h1>${esc(CONFIG.clubName)}<br><em>${esc(CONFIG.appName)}</em></h1>
    <p>Wer ist wann auf dem Platz? Aktive, Jugend, AH und Frauen – alles in einem Plan.</p>
    ${S.demo
      ? `<button class="btn primary" data-act="login">Demo ansehen</button>
         <div class="demo-note">Demo-Modus: Firebase ist noch nicht eingerichtet. Daten liegen nur im Browser und sind nach dem Neuladen weg. Anleitung: README.</div>`
      : `<button class="gbtn" data-act="login">${gIcon}Mit Google anmelden</button>`}
  </div>`;
}
function waitingHtml() {
  return `<div class="gate">
    ${pitchSvg}
    <h1>Fast<br><em>geschafft</em></h1>
    <p>Hallo ${esc(S.me.name)}, dein Zugang ist angelegt und wartet auf Freischaltung. Ein Admin ordnet dir Rolle und Mannschaft zu – danach geht's hier automatisch weiter.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      ${S.demo ? demoSwitch() : ''}
      <button class="btn ghost" data-act="logout">Abmelden</button>
    </div>
  </div>`;
}
function demoSwitch() {
  return `<select class="demo" data-chg="demo" aria-label="Demo-Rolle wechseln">${S.api.demoUsers().map(u => `<option value="${u.id}" ${u.id === S.authUser?.uid ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>`;
}

function planHtml() {

  if (!days.includes(S.selDate)) S.selDate = days[0];
  const today = todayYmd();

  const hh = S.wide ? 56 : 26;
  const hours = [...Array(H)].map((_, i) => `<span style="top:${i * PX + 3}px">${pad(CONFIG.dayStart + i)}</span>`).join('');
  return `
  <div class="weekbar">
    <button class="iconbtn" data-act="week" data-n="-1" aria-label="Vorherige Woche">‹</button>
    <div class="wk"><b>KW ${isoWeek(S.weekStart)}</b><span>${fmtRange(days[0], days[6])}</span></div>

  </div>
  ${S.wide ? '' : stripHtml(days, today)}
  ${S.wide ? '' : `<div class="dayttl">${fmtLong(S.selDate)}</div>`}
  <div class="boardwrap"><div class="board" style="--h:${H * PX}px;--px:${PX}px;--hh:${hh}px;grid-template-columns:40px repeat(${shown.length},minmax(0,1fr))">
    <div class="gutter"><div class="gh"></div><div class="hrs">${hours}</div></div>
    ${shown.map(d => colHtml(d, today, PX)).join('')}
  </div></div>
  <div class="legend">${CONFIG.teams.map(t => `<span><i style="--c:${t.color}"></i>${esc(t.name)}</span>`).join('')}<span><i class="p"></i>Ausstehend</span><span><i class="k"></i>Gesperrt</span></div>`;
}
function stripHtml(days, today) {
  return `<div class="strip">${days.map((d, i) => {
    const teams = [...new Set(S.bookings.filter(b => b.date === d && b.status !== 'rejected').map(b => b.team))];
    const blocked = S.blocks.some(k => blockOn(k, d));
    const dots = teams.slice(0, 4).map(t => `<i style="--c:${team(t).color}"></i>`).join('') + (blocked ? `<i style="--c:var(--bad)"></i>` : '');
    return `<button data-act="day" data-d="${d}" class="${d === S.selDate ? 'on' : ''} ${d === today ? 'today' : ''}"><small>${DAYS[i]}</small><b>${parse(d).getDate()}</b><span class="dots">${dots}</span></button>`;
  }).join('')}</div>`;
}
const laneLW = a => a === 'A' ? [0, 50] : a === 'B' ? [50, 50] : [0, 100];
function colHtml(d, today, PX) {
  const s0 = CONFIG.dayStart * 60, s1 = CONFIG.dayEnd * 60;
  const bks = S.bookings.filter(b => b.date === d && b.status !== 'rejected').sort(byTime);
  const pend = bks.filter(b => b.status === 'pending');
  const evs = bks.map(b => {
    const s = Math.max(toMin(b.start), s0), e = Math.min(toMin(b.end), s1);
    if (e <= s) return '';
    let [l, w] = laneLW(b.area);
    if (b.status === 'pending') {
      const k = pend.slice(0, pend.indexOf(b)).filter(q => halvesClash(q.area, b.area) && timeClash(toMin(q.start), toMin(q.end), toMin(b.start), toMin(b.end))).length;
      const off = w * Math.min(0.16 + 0.12 * k, 0.5); l += off; w -= off;
    }
    const top = (s - s0) / 60 * PX, h = Math.max((e - s) / 60 * PX - 2, 20), t = team(b.team);
    const game = b.kind === 'game';
    const label = game ? `⚽ ${esc(t.name)}${b.ageClass ? ' ' + esc(b.ageClass) : ''}` : esc(t.name);
    const sub = game ? `vs. ${esc(b.opponent || '')}` : esc(b.title || '');
    const tm = game ? `Anstoß ${b.kickoff}` : `${b.start}–${b.end}`;
    return `<button class="ev ${game ? 'game' : ''} ${b.status === 'pending' ? 'pending' : ''} ${h < 40 ? 'tight' : ''}" data-act="ev" data-id="${b.id}" style="top:${top + 1}px;height:${h}px;left:calc(${l}% + 2px);width:calc(${w}% - 4px);--c:${t.color}"><b>${label}${b.status === 'pending' ? ' · ausstehend' : ''}</b><span>${sub}</span><time>${tm}</time></button>`;
  }).join('');
  const blks = S.blocks.filter(k => blockOn(k, d)).map(k => {
    let [bs, be] = blockTimes(k); bs = Math.max(bs, s0); be = Math.min(be, s1);
    if (be <= bs) return '';
    const [l, w] = laneLW(k.area), top = (bs - s0) / 60 * PX, h = Math.max((be - bs) / 60 * PX - 2, 20);
    return `<button class="ev block ${h < 40 ? 'tight' : ''}" data-act="blk" data-id="${k.id}" style="top:${top + 1}px;height:${h}px;left:calc(${l}% + 1px);width:calc(${w}% - 2px)"><b>Gesperrt</b><span>${esc(k.reason)}</span></button>`;
  }).join('');
  let now = '';
  if (d === today) { const n = new Date(), m = n.getHours() * 60 + n.getMinutes(); if (m >= s0 && m <= s1) now = `<div class="now" style="top:${(m - s0) / 60 * PX}px"></div>`; }
  return `<div class="col ${d === today ? 'is-today' : ''}">
    <div class="colhead">${S.wide ? `<div class="dname"><span>${DAYS[dowIdx(d)]}</span><b>${parse(d).getDate()}.</b></div>` : ''}<div class="lanes"><span>${esc(CONFIG.halves.A)}</span><span>${esc(CONFIG.halves.B)}</span></div></div>
    <div class="track" data-act="track" data-d="${d}">${evs}${blks}${now}</div>
  </div>`;
}

// ---------- sheet, dialog, toast ----------
function sheet(html) { $('#sheetCard').innerHTML = html; $('#sheet').classList.remove('hidden'); document.body.style.overflow = 'hidden'; }
function closeSheet() { $('#sheet').classList.add('hidden'); $('#sheetCard').innerHTML = ''; document.body.style.overflow = ''; }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
function ask(title, text, buttons) {
  return new Promise(res => {
    const d = $('#dlg');
    d.innerHTML = `<div class="dlg-card"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="dlg-btns">${buttons.filter(Boolean).map(([v, l, c]) => `<button class="btn ${c || ''}" data-v="${v}">${esc(l)}</button>`).join('')}</div></div>`;
    d.classList.remove('hidden');
    d.onclick = e => { const b = e.target.closest('[data-v]'); if (b || e.target === d) { d.classList.add('hidden'); d.onclick = null; res(b ? b.dataset.v : null); } };
  });
}
let toastT;
function toast(msg, kind = '') { const t = $('#toast'); t.textContent = msg; t.className = `toast show ${kind}`; clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 3200); }
function reportErr(e) {
  console.error(e);
  const c = e?.code || '';
  const msg = c.includes('permission-denied') ? 'Keine Berechtigung für diese Aktion.'
    : c === 'auth/unauthorized-domain' ? 'Diese Adresse ist in Firebase nicht freigegeben (Authentication → Settings → Authorized domains).'
    : c.includes('unavailable') ? 'Keine Verbindung – bitte später erneut versuchen.'
    : (e?.message || String(e));
  toast(msg, 'bad');
}

    <div class="kgrp k-game hidden">

      <div class="field garea hidden"><span class="lbl">Kleinfeld auf</span><div class="seg seg2">${['A', 'B'].map(a => `<label><input type="radio" name="garea" value="${a}" ${a === 'A' ? 'checked' : ''}><span>${esc(AREA[a])}</span></label>`).join('')}</div></div>
    </div>
    <div class="kgrp k-training">
      <div class="two"><label class="field"><span class="lbl">Von</span><input type="time" name="start" step="900" value="${start}"></label><label class="field"><span class="lbl">Bis</span><input type="time" name="end" step="900" value="${end}"></label></div>
      <div class="field"><span class="lbl">Bereich</span><div class="seg">${['full', 'A', 'B'].map(a => `<label><input type="radio" name="area" value="${a}" ${a === 'full' ? 'checked' : ''}><span>${esc(a === 'full' ? 'Ganz' : AREA[a])}</span></label>`).join('')}</div></div>
      <label class="check"><input type="checkbox" name="repeat"><span>Wöchentlich wiederholen</span></label>
      <label class="field until hidden"><span class="lbl">Wiederholen bis</span><input type="date" name="until" value="${addDays(date, 7 * 8)}"></label>

    <button class="btn primary block" id="bfGo">Buchen</button>

  </form>`);
  const f = $('#bf');
  const upd = () => bfUpdate(f);
  f.addEventListener('input', upd); f.addEventListener('change', upd);
  f.addEventListener('submit', e => { e.preventDefault(); submitBooking(f).catch(reportErr).finally(() => { const b = $('#bfGo'); if (b) b.disabled = false; }); });
  upd();
}
function bfUpdate(f) {
  const b = readBooking(f), game = b.kind === 'game';
  f.querySelectorAll('.k-game').forEach(el => el.classList.toggle('hidden', !game));
  f.querySelectorAll('.k-training').forEach(el => el.classList.toggle('hidden', game));
  f.querySelector('.age').classList.toggle('hidden', b.team !== 'jugend');
  f.querySelector('.garea').classList.toggle('hidden', !(b.team === 'jugend' && SMALL_FIELD.includes(b.ageClass)));
  f.querySelector('.until').classList.toggle('hidden', !b.repeat);
  f.querySelector('.sh-head h3').textContent = game ? 'Heimspiel eintragen' : 'Platz buchen';
  const direct = bookDirect();
  $('#bfGo').textContent = !b.team ? 'Eintragen' : direct ? (game ? 'Heimspiel eintragen' : 'Verbindlich buchen') : 'Eintragen (ausstehend)';
  const msgs = [];
  if (b.team) msgs.push(direct ? `<span class="ok">✓ Wird sofort eingetragen.</span>` : `<span class="warn">Wird als „ausstehend“ eingetragen – ein Admin bestätigt.</span>`);
  if (game && b.kickoff) msgs.push(`Platz belegt ${b.start}–${b.end} Uhr · ${esc(AREA[b.area])}`);
  const { date, start, end, area } = b;
  if (date && start && end) {
    if (toMin(end) <= toMin(start)) msgs.push(`<span class="bad">Ende muss nach Beginn liegen.</span>`);
    else if (date >= S.weekStart && date <= addDays(S.weekStart, 6)) {
      const c = findConflicts({ date, start, end, area }, S.bookings, S.blocks);
      if (c.length) msgs.push(`<span class="bad">⚠ Belegt: ${esc(conflictLabel(c[0]))}</span>`);
    }
  }
  $('#bfHint').innerHTML = msgs.join('<br>');
}
async function submitBooking(f) {
  const b = readBooking(f), err = bookingError(b);
  if (err) return toast(err, 'bad');
  const { team: tm, title, date, start, end, area, note, repeat, until } = b;
  const extra = b.kind === 'game' ? { kind: 'game', opponent: b.opponent, kickoff: b.kickoff, ageClass: b.ageClass } : {};
  const dates = [date];
  if (repeat) {
    if (!until || until <= date) return toast('Bitte ein Enddatum für die Serie wählen', 'bad');
    for (let d = addDays(date, 7); d <= until && dates.length < 60; d = addDays(d, 7)) dates.push(d);
  }
  $('#bfGo').disabled = true;
  const admin = isAdmin();
  const status = bookDirect() ? 'confirmed' : 'pending';
  const existing = await S.api.getBookings(dates[0], dates.at(-1));
  const clash = dates.filter(d => findConflicts({ date: d, start, end, area }, existing, S.blocks).length);
  let use = dates;
  if (clash.length) {
    const first = findConflicts({ date: clash[0], start, end, area }, existing, S.blocks)[0];
    const info = `${fmtDate(clash[0])}: ${conflictLabel(first)}${clash.length > 1 ? ` (+${clash.length - 1} weitere)` : ''}`;
    if (admin) {
      const c = await ask('Überschneidung', `${clash.length} von ${dates.length} Termin(en) sind belegt.\n${info}`,
        [['force', 'Trotzdem eintragen', 'danger'], dates.length > clash.length && ['skip', 'Nur freie Termine', 'primary'], ['cancel', 'Abbrechen', 'ghost']]);
      if (!c || c === 'cancel') return;
      if (c === 'skip') use = dates.filter(d => !clash.includes(d));
    } else {
      if (clash.length === dates.length) { await ask('Zeit ist belegt', info, [['ok', 'OK', 'primary']]); return; }
      const c = await ask('Teilweise belegt', `${clash.length} Termin(e) sind belegt und werden übersprungen.\n${info}`, [['skip', `${dates.length - clash.length} freie Termine buchen`, 'primary'], ['cancel', 'Abbrechen', 'ghost']]);
      if (c !== 'skip') return;
      use = dates.filter(d => !clash.includes(d));
    }
  }
  const seriesId = use.length > 1 ? rid() : null;
  await S.api.addBookings(use.map(d => ({ ...extra, team: tm, title, date: d, start, end, area, note, status, seriesId, createdBy: S.me.id, createdByName: S.me.name || '', createdAt: Date.now() })));
  closeSheet();

async function approve(items) {
  items = items.filter(Boolean);
  if (!items.length) return;
  const dates = items.map(i => i.date).sort();
  const existing = await S.api.getBookings(dates[0], dates.at(-1));
  const bad = items.filter(i => findConflicts(i, existing, S.blocks, i.id).length);
  let ok = items;
  if (bad.length) {
    const c0 = findConflicts(bad[0], existing, S.blocks, bad[0].id)[0];
    const c = await ask('Überschneidung', `${bad.length} von ${items.length} Termin(en) kollidieren.\n${fmtDate(bad[0].date)}: ${conflictLabel(c0)}`,
      [['force', 'Trotzdem bestätigen', 'danger'], bad.length < items.length && ['free', 'Nur freie bestätigen', 'primary'], ['cancel', 'Abbrechen', 'ghost']]);
    if (!c || c === 'cancel') return;
    if (c === 'free') ok = items.filter(i => !bad.includes(i));
  }
  await S.api.updateBookings(ok.map(i => i.id), { status: 'confirmed', decidedBy: S.me.name || '', decidedAt: Date.now() });
  closeSheet();
  toast(`✓ ${ok.length} Termin(e) bestätigt`);
}
async function reject(items) {
  items = items.filter(Boolean);
  if (!items.length) return;
  const c = await ask('Eintrag ablehnen?', items.length > 1 ? `${items.length} Termine der Serie werden abgelehnt.` : `${fmtDate(items[0].date)} · ${items[0].start}–${items[0].end}`, [['yes', 'Ablehnen', 'danger'], ['no', 'Abbrechen', 'ghost']]);
  if (c !== 'yes') return;
  await S.api.updateBookings(items.map(i => i.id), { status: 'rejected', decidedBy: S.me.name || '', decidedAt: Date.now() });
  closeSheet();
  toast('Abgelehnt');
}
async function delBooking(id, series) {
  const b = lookup(id);
  if (!b) return;
  let ids = [b.id];
  if (series && b.seriesId) {
    const all = await S.api.getSeries(b.seriesId);
    ids = all.filter(x => x.date >= b.date && (isAdmin() || x.createdBy === S.me.id)).map(x => x.id);
  }
  const c = await ask(ids.length > 1 ? `${ids.length} Termine löschen?` : 'Termin löschen?', 'Das lässt sich nicht rückgängig machen.', [['yes', 'Löschen', 'danger'], ['no', 'Abbrechen', 'ghost']]);
  if (c !== 'yes') return;
  await S.api.deleteBookings(ids);
  closeSheet();
  toast('Gelöscht');
}

// ---------- Firebase backend ----------
async function firebaseApi() {
  const B = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [A, Au, F] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
  const app = A.initializeApp(CONFIG.firebase);
  const auth = Au.getAuth(app);
  const db = F.getFirestore(app);
  const col = n => F.collection(db, n);
  const rows = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  const live = (q, cb) => F.onSnapshot(q, s => cb(rows(s)), e => { if (isMember()) reportErr(e); });
  const chunks = (arr, n = 400) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };
  const batchEach = async (items, fn) => { for (const part of chunks(items)) { const b = F.writeBatch(db); part.forEach(x => fn(b, x)); await b.commit(); } };
  const admins = CONFIG.adminEmails.map(x => x.toLowerCase());
  Au.getRedirectResult(auth).catch(reportErr);
  return {
    onAuth: cb => Au.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, name: u.displayName || u.email, email: (u.email || '').toLowerCase(), photo: u.photoURL || '' } : null)),
    async signIn() {
      const p = new Au.GoogleAuthProvider();
      p.setCustomParameters({ prompt: 'select_account' });
      try { await Au.signInWithPopup(auth, p); }
      catch (e) {
        if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) await Au.signInWithRedirect(auth, p);
        else if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(e.code)) throw e;
      }
    },
    signOut: () => Au.signOut(auth),
    async ensureProfile(u) {
      const ref = F.doc(db, 'users', u.uid);
      const snap = await F.getDoc(ref);
      if (!snap.exists()) await F.setDoc(ref, { name: u.name, email: u.email, photo: u.photo, role: admins.includes(u.email) ? 'admin' : 'pending', teams: [], createdAt: Date.now() });
      else if (snap.data().name !== u.name || snap.data().photo !== u.photo) await F.updateDoc(ref, { name: u.name, photo: u.photo }).catch(() => {});
    },
    subUser: (uid, cb) => F.onSnapshot(F.doc(db, 'users', uid), s => cb(s.exists() ? { id: s.id, ...s.data() } : null), reportErr),
    subUsers: cb => live(col('users'), cb),
    subBookings: (from, to, cb) => live(F.query(col('bookings'), F.where('date', '>=', from), F.where('date', '<=', to)), cb),
    subPending: cb => live(F.query(col('bookings'), F.where('status', '==', 'pending')), cb),
    subMine: (uid, cb) => live(F.query(col('bookings'), F.where('createdBy', '==', uid)), cb),
    subBlocks: cb => live(col('blocks'), cb),
    getBookings: async (from, to) => rows(await F.getDocs(F.query(col('bookings'), F.where('date', '>=', from), F.where('date', '<=', to)))),
    getSeries: async sid => rows(await F.getDocs(F.query(col('bookings'), F.where('seriesId', '==', sid)))),
    addBookings: list => batchEach(list, (b, x) => b.set(F.doc(col('bookings')), x)),
    updateBookings: (ids, patch) => batchEach(ids, (b, id) => b.update(F.doc(db, 'bookings', id), patch)),
    deleteBookings: ids => batchEach(ids, (b, id) => b.delete(F.doc(db, 'bookings', id))),
    addBlock: k => F.addDoc(col('blocks'), k),
    deleteBlock: id => F.deleteDoc(F.doc(db, 'blocks', id)),
    updateUser: (uid, p) => F.updateDoc(F.doc(db, 'users', uid), p),
    deleteUser: uid => F.deleteDoc(F.doc(db, 'users', uid)),
  };
}

    subPending: cb => sub(() => cb(copy(bookings).filter(b => b.status === 'pending'))),
    subMine: (uid, cb) => sub(() => cb(copy(bookings).filter(b => b.createdBy === uid))),
    subBlocks: cb => sub(() => cb(copy(blocks))),
    getBookings: async (f, t) => copy(bookings).filter(b => b.date >= f && b.date <= t),
    getSeries: async s => copy(bookings).filter(b => b.seriesId === s),
    addBookings: list => later(() => list.forEach(x => { const id = nid('b'); bookings.set(id, { ...x, id }); })),
    updateBookings: (ids, p) => later(() => ids.forEach(id => bookings.has(id) && Object.assign(bookings.get(id), p))),
    deleteBookings: ids => later(() => ids.forEach(id => bookings.delete(id))),
    addBlock: k => later(() => { const id = nid('k'); blocks.set(id, { ...k, id }); }),
    deleteBlock: id => later(() => blocks.delete(id)),
    updateUser: (uid, p) => later(() => users.has(uid) && Object.assign(users.get(uid), p)),
    deleteUser: uid => later(() => { const u = users.get(uid); if (u) { u.role = 'pending'; u.teams = []; } }),
  };
}

// ---------- boot ----------
(async () => {
  S.demo = !CONFIG.firebase.apiKey;
  try { S.api = S.demo ? demoApi() : await firebaseApi(); }
  catch (e) {
    console.error(e);
    $('#app').innerHTML = `<div class="gate"><h1>Keine<br><em>Verbindung</em></h1><p>Firebase konnte nicht geladen werden. Internetverbindung prüfen und neu laden.</p><button class="btn primary" onclick="location.reload()">Neu laden</button></div>`;
    return;
  }
  S.booting = false;
  S.api.onAuth(onAuth);
  render();
  setInterval(() => { if (S.view === 'plan' && isMember()) render(); }, 60000);
})();
</script>
</body>
</html>
